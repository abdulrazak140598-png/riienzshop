<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topup</title>
<style>
body{background:#0f0f2d;color:#fff;font-family:system-ui;margin:0;padding:14px}
.card{background:#1a1a3d;border-radius:16px;padding:14px;margin-top:12px}
input{background:#0f0f2d;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;box-sizing:border-box}
.nom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{background:#26265a;padding:12px;border-radius:12px;cursor:pointer;border:2px solid transparent}
.item.active{border-color:#a21caf;background:#3b1a5a}
button#beliBtn{background:#a21caf;color:#fff;border:0;padding:14px 22px;border-radius:12px;font-weight:900;cursor:pointer}
#payModal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;overflow:auto;padding:16px}
</style></head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center"><b id="judul">Loading...</b><span>IDR</span></div>

<div class="card"><b>1. Masukkan Data Akun</b><div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1">USER ID<input id="uid" placeholder="12345678"></div><div style="flex:1">ZONE ID<input id="zid" placeholder="1234"></div></div></div>

<div class="card"><b>2. Pilih Nominal</b><div id="list" class="nom"></div></div>

<div class="card"><b>3. Pilih Pembayaran</b><div style="background:#facc15;color:#111;padding:12px;border-radius:12px;margin-top:10px;font-weight:800">QRIS All Payment / DuitNow QR<br><span style="font-weight:400;font-size:12px">ID & MY - Auto 1-3 Menit</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><div><div style="font-size:12px;color:#aaa">TOTAL BAYAR</div><div id="totalTxt" style="font-weight:900;font-size:18px">Pilih nominal</div></div><button id="beliBtn" onclick="beli()">Beli</button></div></div>

<div id="payModal"></div>

<script>
let params = new URLSearchParams(location.search);
let curGame = params.get('game') || 'Mobile Legends';
document.getElementById('judul').innerText = curGame;
let listData = [
  {d:'5 Diamond', p:2000},{d:'11 Diamond', p:4000},{d:'59 Diamond', p:16000},{d:'144 Diamond', p:38000},
  {d:'250 Diamond', p:65000},{d:'4500 Diamond', p:400000},{d:'16500 Diamond', p:800000},{d:'32500 Diamond', p:1000000},
  {d:'64500 Diamond', p:1500000},{d:'120500 Diamond', p:2000000},{d:'240000 Diamond', p:2500000},{d:'310000 Diamond', p:3000000}
];
let sel = null;
let uid = document.getElementById('uid');
let listEl = document.getElementById('list');
listData.forEach(function(it){
  let div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = '<b>'+it.d+'</b><br>Rp '+it.p.toLocaleString('id-ID');
  div.onclick = function(){
    document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
    div.classList.add('active');
    sel = it;
    document.getElementById('totalTxt').innerText = 'Rp '+it.p.toLocaleString('id-ID');
  };
  listEl.appendChild(div);
});
function closePay(){ document.getElementById('payModal').style.display='none'; }

async function beli(){
  if(!sel){alert('Pilih nominal dulu bang!');return;}
  if(!uid.value){alert('Isi ID Game dulu!');return;}
  let modal = document.getElementById('payModal');
  modal.style.display = 'flex';
  modal.innerHTML = '<div style="background:white;color:#111;padding:20px;border-radius:16px;text-align:center">Membuat QR Rp '+sel.p.toLocaleString('id-ID')+'...</div>';
  try{
    let res = await fetch('/api/kipay-qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:sel.p, note:curGame+' | '+sel.d+' | ID:'+uid.value})});
    let data = await res.json();
    if(!data.success || !data.qr_image){ modal.innerHTML = '<div style="background:white;color:#111;padding:20px;border-radius:16px;text-align:center">Gagal, coba lagi<br><button id="b1" style="padding:10px 20px;margin-top:10px">Tutup</button></div>'; document.getElementById('b1').onclick=closePay; return; }
    let zidVal = document.getElementById('zid').value;
    let idText = uid.value + (zidVal ? ' ('+zidVal+')' : '');
    let totalText = data.total_amount.toLocaleString('id-ID');
    let nominalText = data.nominal_diminta.toLocaleString('id-ID');
    let kodeText = data.unique_code ? '+ Kode Unik '+data.unique_code : '';
    modal.innerHTML =
    '<div style="background:#fff;color:#111;padding:0;border-radius:24px;text-align:center;max-width:380px;width:92%;margin:auto;overflow:hidden">'+
      '<div style="background:linear-gradient(135deg,#6d28d9,#a21caf);padding:18px 16px;color:#fff">'+
        '<div style="font-size:11px;letter-spacing:2px;opacity:.8">TOPUP GAME - PEMBAYARAN QRIS</div>'+
        '<div style="font-weight:900;font-size:18px;margin-top:4px">'+curGame+' - '+sel.d+'</div>'+
        '<div style="font-size:12px;opacity:.9;margin-top:2px">ID: '+idText+'</div>'+
      '</div>'+
      '<div style="padding:16px 16px 0"><div style="font-size:11px;color:#888">TOTAL BAYAR - BAYAR PERSIS SEGINI</div>'+
        '<div style="font-size:32px;font-weight:900;margin-top:4px">Rp '+totalText+'</div>'+
        '<div style="font-size:11px;color:#a21caf;font-weight:700;margin-top:4px">Nominal Rp '+nominalText+' '+kodeText+'</div></div>'+
      '<div style="padding:14px 16px 0"><div style="border:1.5px dashed #e9d5ff;border-radius:18px;padding:14px">'+
        '<img src="'+data.qr_image+'" style="width:250px;height:250px;margin:auto;display:block" />'+
        '<div style="font-size:11px;color:#666;margin-top:8px">Scan dengan DANA / OVO / GoPay / TNG</div></div></div>'+
      '<div style="text-align:left;background:#f9fafb;margin:14px 16px 0;padding:12px;border-radius:14px;font-size:12px;line-height:1.6">1. Buka DANA / OVO / GoPay / TNG<br>2. Pilih Scan / QRIS lalu scan QR di atas<br>3. Pastikan nominalnya <b>Rp '+totalText+'</b> lalu Bayar</div>'+
      '<div style="padding:14px 16px 16px;display:flex;gap:10px">'+
        '<button id="btnSalin" style="flex:1;background:#111;color:#fff;border:0;padding:13px;border-radius:12px;font-weight:800">Salin Nominal</button>'+
        '<button id="btnTutup" style="flex:1;background:#f3f4f6;border:0;padding:13px;border-radius:12px;font-weight:800">Tutup</button>'+
      '</div></div>';
    document.getElementById('btnTutup').onclick = closePay;
    document.getElementById('btnSalin').onclick = function(){ navigator.clipboard.writeText(String(data.total_amount)); this.innerText='Tersalin'; };
  }catch(e){ modal.innerHTML = '<div style="background:white;color:#111;padding:20px;border-radius:16px">Error: '+String(e)+'<br><button id="b2" style="padding:10px 20px;margin-top:10px">Tutup</button></div>'; document.getElementById('b2').onclick=closePay; }
}
</script>
</body></html>
